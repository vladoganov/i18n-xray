name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: verify · pack · publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Node 20 ships npm 10, which predates OIDC trusted publishing (needs >= 11.5.1).
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./packages/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag, but packages/cli is $pkg"
            exit 1
          fi
          echo "publishing i18n-xray@$pkg"

      # prepack copies README.md and LICENSE in from the repo root.
      - name: Pack
        working-directory: packages/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      # Authenticates via OIDC against the trusted publisher configured on npm;
      # no token, and provenance is attached automatically.
      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/i18n-xray-*.tgz --access public
